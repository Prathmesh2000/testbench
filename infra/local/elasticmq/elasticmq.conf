# One queue per channel (HLD §5.7) so a slow or failing provider never delays the others.
# After 5 failed receives a message moves to the channel's dead-letter queue.
include classpath("application.conf")

node-address { protocol = http, host = localhost, port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0", sqs-limits = strict }
rest-stats { enabled = true, bind-port = 9325, bind-hostname = "0.0.0.0" }

queues {
  notify-email { defaultVisibilityTimeout = 30 seconds, deadLettersQueue { name = "notify-email-dlq", maxReceiveCount = 5 } }
  notify-sms { defaultVisibilityTimeout = 30 seconds, deadLettersQueue { name = "notify-sms-dlq", maxReceiveCount = 5 } }
  notify-slack { defaultVisibilityTimeout = 30 seconds, deadLettersQueue { name = "notify-slack-dlq", maxReceiveCount = 5 } }
  notify-teams { defaultVisibilityTimeout = 30 seconds, deadLettersQueue { name = "notify-teams-dlq", maxReceiveCount = 5 } }
  notify-discord { defaultVisibilityTimeout = 30 seconds, deadLettersQueue { name = "notify-discord-dlq", maxReceiveCount = 5 } }
  notify-inapp { defaultVisibilityTimeout = 30 seconds, deadLettersQueue { name = "notify-inapp-dlq", maxReceiveCount = 5 } }
  notify-fallback { defaultVisibilityTimeout = 30 seconds, deadLettersQueue { name = "notify-fallback-dlq", maxReceiveCount = 5 } }
  notify-email-dlq {}
  notify-sms-dlq {}
  notify-slack-dlq {}
  notify-teams-dlq {}
  notify-discord-dlq {}
  notify-inapp-dlq {}
  notify-fallback-dlq {}
}
